<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Newsroom — Ofhir</title>
<meta name="description" content="Newsroom de Ofhir: noticias, anuncios, avances, pensamientos, prensa y el estado de la plataforma.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="alternate" type="application/rss+xml" title="Ofhir · Newsroom" href="bitacora.xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Newsroom de Ofhir. Superficie blanca, tipografía grande y ligera,
   reglas de 1px, cero radios. El color solo vive en las portadas y en el estado. */
:root{
  --bg:#FFFFFF; --bg2:#F5F5F4; --tx:#111214; --tx2:#4A4E55; --tx3:#8A8F96;
  --ln:#E3E4E6; --ln2:#111214; --inv:#0B0C0E; --invtx:#F4F4F2;
  --ok:#2F7A4A; --rie:#9A6B1F; --mal:#A33A3A; --az:#2F5F9C;
  --ui:'Inter Tight',system-ui,-apple-system,sans-serif;
  --mo:'JetBrains Mono',ui-monospace,monospace;
  --w:1440px; --g:clamp(16px,3.2vw,48px);
}
html[data-theme="dark"]{
  --bg:#0B0C0E; --bg2:#131417; --tx:#F2F2F0; --tx2:#A9ADB3; --tx3:#6F747B;
  --ln:#23252A; --ln2:#F2F2F0; --inv:#F2F2F0; --invtx:#0B0C0E;
  --ok:#5FAE7A; --rie:#C9984A; --mal:#D06A6A; --az:#6F98D0;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--ui);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
a{color:inherit;text-decoration:none}
svg{display:block}
img{display:block;max-width:100%}
.w{max-width:var(--w);margin:0 auto;padding:0 var(--g)}
.mo{font-family:var(--mo);letter-spacing:.02em}
.k{font:500 11px/1.4 var(--mo);letter-spacing:.08em;text-transform:uppercase;color:var(--tx3)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ── Cabecera ── */
.hd{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px)}
.hd-a{display:flex;align-items:center;gap:20px;padding-top:22px}
.mk{display:flex;align-items:baseline;gap:14px;min-width:0}
.mk img{height:24px;width:auto;align-self:center}
html[data-theme="dark"] .mk img{filter:invert(1)}
.mk span{font-size:clamp(17px,1.7vw,22px);color:var(--tx3);white-space:nowrap}
.mk span::before{content:"/";margin-right:12px;color:var(--tx3)}
.hd .sp{flex:1}
.hd-st{display:flex;align-items:center;justify-content:center;gap:10px;height:50px;min-width:clamp(150px,18vw,276px);padding:0 22px;
  border:1px solid var(--ln2);font-size:17px;transition:background .15s,color .15s}
.hd-st:hover{background:var(--tx);color:var(--bg)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--tx3)}
.dot.ok{background:var(--ok)}.dot.rie{background:var(--rie)}.dot.mal{background:var(--mal)}.dot.az{background:var(--az)}
.dot.ok.vivo{animation:lat 2.4s ease-in-out infinite}
@keyframes lat{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 45%,transparent)}50%{box-shadow:0 0 0 5px transparent}}
.sq{display:flex;border:1px solid var(--ln2)}
.sq button{width:50px;height:48px;display:grid;place-items:center;transition:background .15s,color .15s}
.sq button+button{border-left:1px solid var(--ln2)}
.sq button:hover{background:var(--tx);color:var(--bg)}
.nv{display:flex;gap:26px;padding:16px 0 18px;overflow-x:auto;scrollbar-width:none}
.nv::-webkit-scrollbar{display:none}
.nv a{font-size:clamp(15px,1.25vw,19px);color:var(--tx3);white-space:nowrap;transition:color .15s;padding-bottom:3px;border-bottom:1px solid transparent}
.nv a:hover{color:var(--tx)}
.nv a[aria-current="page"]{color:var(--tx);border-bottom-color:var(--tx)}
@media (max-width:720px){.hd-st{min-width:0;padding:0 14px;height:44px;font-size:15px}.hd-st b{display:none}.sq button{width:44px;height:42px}.mk span{display:none}}

/* ── Títulos grandes ── */
.hero{padding:clamp(40px,7vw,96px) 0 clamp(36px,6vw,88px)}
.hero h1{margin:0;font-weight:400;font-size:clamp(56px,10.4vw,150px);line-height:.95;letter-spacing:-.045em}
.hero p{margin:22px 0 0;max-width:46ch;font-size:clamp(17px,1.5vw,21px);color:var(--tx2)}
.hero .k{display:block;margin-bottom:18px}
.regla{border:0;border-top:1px solid var(--ln2);margin:0}

/* ── Tarjetas ── */
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(20px,2.4vw,38px)}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(20px,2.4vw,38px)}
@media (max-width:980px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:680px){.g2,.g3{grid-template-columns:1fr}}
.cd{display:flex;flex-direction:column;min-width:0}
.cv{position:relative;aspect-ratio:2/1;overflow:hidden;background:var(--bg2)}
.cv svg,.cv img{width:100%;height:100%;object-fit:cover;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.cd:hover .cv svg,.cd:hover .cv img{transform:scale(1.025)}
.cd-m{display:flex;gap:14px;align-items:center;margin-top:22px;flex-wrap:wrap}
.cd h3{margin:12px 0 0;font-weight:400;font-size:clamp(24px,2.5vw,40px);line-height:1.1;letter-spacing:-.025em}
.g3 .cd h3{font-size:clamp(21px,1.8vw,28px)}
.cd p{margin:12px 0 0;color:var(--tx2);font-size:16px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mas{margin-top:auto;padding-top:28px}
.mas span{display:flex;justify-content:space-between;align-items:center;padding-bottom:16px;border-bottom:1px solid var(--ln2);font-size:clamp(17px,1.4vw,21px)}
.mas svg{transition:transform .2s}
.cd:hover .mas svg{transform:translateX(5px)}
.sec{padding:clamp(56px,7vw,110px) 0 0}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:clamp(26px,3vw,44px);flex-wrap:wrap}
.sec-h h2{margin:0;font-weight:400;font-size:clamp(34px,4.6vw,68px);line-height:1;letter-spacing:-.035em}
.sec-h a{font-size:17px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--ln2);padding-bottom:6px}
.chip{display:inline-flex;align-items:center;gap:7px}
.chip i{width:7px;height:7px;display:block}

/* ── Lista de lo más reciente ── */
.fl{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.fl button{font:500 12px/1 var(--mo);letter-spacing:.06em;text-transform:uppercase;padding:10px 14px;border:1px solid var(--ln);color:var(--tx2);transition:.15s}
.fl button:hover{border-color:var(--ln2);color:var(--tx)}
.fl button[aria-pressed="true"]{background:var(--tx);border-color:var(--tx);color:var(--bg)}
.ls{border-top:1px solid var(--ln2)}
.lr{display:grid;grid-template-columns:150px 170px minmax(0,1fr) 40px;gap:24px;align-items:baseline;padding:24px 0;border-bottom:1px solid var(--ln);transition:background .15s}
.lr:hover{background:var(--bg2)}
.lr b{font-weight:400;font-size:clamp(18px,1.6vw,24px);letter-spacing:-.015em;line-height:1.25}
.lr small{display:block;margin-top:6px;color:var(--tx3);font-size:14.5px}
.lr svg{justify-self:end;align-self:center;transition:transform .2s}
.lr:hover svg{transform:translateX(5px)}
@media (max-width:820px){.lr{grid-template-columns:1fr 28px;gap:6px 14px}.lr .k{grid-column:1}.lr>div{grid-column:1}.lr svg{grid-row:1/4;grid-column:2}}
.vc{padding:40px 0;color:var(--tx3);font-size:17px}

/* ── Banda de estado ── */
.bd{background:var(--inv);color:var(--invtx);margin-top:clamp(70px,8vw,120px)}
.bd .w{padding-top:clamp(44px,5vw,72px);padding-bottom:clamp(44px,5vw,72px)}
.bd-g{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(30px,5vw,80px);align-items:end}
@media (max-width:900px){.bd-g{grid-template-columns:1fr}}
.bd .k{color:color-mix(in srgb,var(--invtx) 55%,transparent)}
.bd h2{margin:16px 0 0;font-weight:400;font-size:clamp(36px,4.6vw,66px);line-height:1;letter-spacing:-.035em;display:flex;align-items:flex-start;gap:18px}
.bd h2 .dot{margin-top:.38em}
.bd h2 .dot{width:14px;height:14px}
.bd-n{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid color-mix(in srgb,var(--invtx) 25%,transparent)}
.bd-n div{padding:18px 0 0}
.bd-n b{display:block;font:400 clamp(20px,2vw,28px)/1 var(--mo)}
.bd-n span{display:block;margin-top:10px}
.bars{display:flex;gap:2px;height:44px;margin:26px 0 10px}
.bars i{flex:1;min-width:2px;background:var(--ok);opacity:.8;position:relative}
.bars i.caido{background:var(--mal);opacity:1}
.bars i:hover{opacity:1;outline:1px solid currentColor;z-index:2}
.bars i:hover::after{content:attr(data-t);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);white-space:nowrap;padding:6px 9px;font:11px/1.3 var(--mo);background:var(--bg);color:var(--tx);border:1px solid var(--ln2)}
.bars-l{display:flex;justify-content:space-between}
.bd .mas span{border-bottom-color:var(--invtx)}
.bd a.ln{display:inline-flex;align-items:center;gap:12px;margin-top:30px;font-size:19px;padding-bottom:8px;border-bottom:1px solid var(--invtx)}

/* ── Artículo ── */
.ar{max-width:1100px}
.ar-v{display:inline-flex;align-items:center;gap:10px;margin-top:40px;font-size:16px;color:var(--tx2)}
.ar-v:hover{color:var(--tx)}
.ar-m{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:clamp(36px,5vw,64px)}
.ar h1{margin:22px 0 0;font-weight:400;font-size:clamp(40px,5.6vw,84px);line-height:1.02;letter-spacing:-.04em;max-width:18ch}
.ar-rs{margin:28px 0 0;font-size:clamp(19px,1.8vw,25px);line-height:1.45;color:var(--tx2);max-width:44ch}
.ar-cv{margin-top:clamp(36px,5vw,64px)}
.ar-b{display:grid;grid-template-columns:220px minmax(0,700px);gap:clamp(24px,5vw,80px);margin-top:clamp(40px,5vw,72px)}
@media (max-width:900px){.ar-b{grid-template-columns:1fr}}
.ar-l{display:flex;flex-direction:column;gap:22px;border-top:1px solid var(--ln2);padding-top:18px;align-self:start;position:sticky;top:150px}
@media (max-width:900px){.ar-l{position:static;flex-direction:row;flex-wrap:wrap;gap:16px 34px}}
.ar-l div span{display:block}
.ar-l div b{display:block;margin-top:6px;font-weight:400;font-size:15.5px}
.ar-l button{display:inline-flex;align-items:center;gap:8px;font-size:15px;border-bottom:1px solid var(--ln2);padding-bottom:4px;align-self:flex-start}
.tx{font-size:clamp(17px,1.3vw,19px);line-height:1.7;color:var(--tx)}
.tx p{margin:0 0 1.15em}
.tx ul,.tx ol{margin:0 0 1.15em;padding-left:1.2em}
.tx li{margin-bottom:.4em}
.tx li::marker{color:var(--tx3)}
.tx blockquote{margin:1.4em 0;padding:0 0 0 22px;border-left:2px solid var(--ln2);font-size:1.18em;line-height:1.5;letter-spacing:-.01em}
.tx strong{font-weight:600}
.tx em{font-style:italic}
.tx s{opacity:.6}
.tx mark{background:color-mix(in srgb,#E9C46A 45%,transparent);color:inherit;padding:0 2px}
.tx code{font:.86em var(--mo);background:var(--bg2);padding:2px 6px}
.tx a{text-decoration:underline;text-decoration-color:var(--tx3);text-underline-offset:4px}
.tx a:hover{text-decoration-color:currentColor}
.tx .md-h{margin:1.8em 0 .6em;font-weight:500;letter-spacing:-.02em;line-height:1.2}
.tx h3.md-h{font-size:1.5em}.tx h4.md-h{font-size:1.22em}
.tx h5.md-h{font:500 12px/1.4 var(--mo);letter-spacing:.08em;text-transform:uppercase;color:var(--tx3)}
.tx>.md-h:first-child{margin-top:0}
.tx ul.md-tl{list-style:none;padding-left:0}
.tx .md-tl li{display:flex;gap:12px}
.tx .md-tl li::before{content:"";flex:none;width:14px;height:14px;margin-top:.45em;border:1px solid var(--ln2)}
.tx .md-tl li.md-ok::before{background:var(--tx)}
.tx .md-tl li.md-ok{color:var(--tx3)}
.tx hr{border:0;border-top:1px solid var(--ln);margin:2em 0}
.tx .md-dest{margin:0 0 1.15em;padding:18px 20px;border:1px solid var(--ln2);border-left-width:4px}
.up{display:grid;grid-template-columns:150px minmax(0,1fr);gap:22px;padding:22px 0;border-top:1px solid var(--ln)}
.up .tx{font-size:16.5px}
@media (max-width:620px){.up{grid-template-columns:1fr;gap:8px}}

/* ── Página de status ── */
.st-g{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(30px,5vw,80px)}
@media (max-width:900px){.st-g{grid-template-columns:1fr}}
.st-big{display:flex;align-items:center;gap:20px;font-weight:400;font-size:clamp(34px,4.4vw,62px);line-height:1;letter-spacing:-.035em;margin:0}
.st-big .dot{width:16px;height:16px}
.st-n{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--ln2);margin-top:34px}
.st-n div{padding:18px 0}
.st-n b{display:block;font:400 clamp(20px,2vw,30px)/1 var(--mo)}
.st-n span{display:block;margin-top:10px}
.st-b .bars i:hover::after{background:var(--tx);color:var(--bg);border:0}
.spark svg{width:100%;height:70px;overflow:visible}
.cm{border-top:1px solid var(--ln2)}
.cm div{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--ln);font-size:17px}
.cm span{display:inline-flex;align-items:center;gap:9px;font:500 12px/1 var(--mo);letter-spacing:.06em;text-transform:uppercase}
.cm span.ok{color:var(--ok)}.cm span.rie{color:var(--rie)}

/* ── Pie ── */
.pi{background:var(--inv);color:var(--invtx);margin-top:clamp(80px,9vw,140px)}
.bd+.pi{margin-top:0}
.pi .w{padding-top:clamp(50px,6vw,90px);padding-bottom:36px}
.pi-g{display:grid;grid-template-columns:minmax(0,1.3fr) repeat(3,minmax(0,1fr));gap:36px}
@media (max-width:900px){.pi-g{grid-template-columns:1fr 1fr}}
.pi img{height:clamp(40px,5vw,64px);width:auto;filter:invert(1)}
html[data-theme="dark"] .pi img{filter:none}
.pi p{margin:22px 0 0;max-width:34ch;color:color-mix(in srgb,var(--invtx) 62%,transparent);font-size:15.5px}
.pi h4{margin:0 0 16px;font:500 11px/1.4 var(--mo);letter-spacing:.08em;text-transform:uppercase;color:color-mix(in srgb,var(--invtx) 50%,transparent)}
.pi ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.pi li a,.pi li button{font-size:16px;color:var(--invtx);opacity:.88}
.pi li a:hover,.pi li button:hover{opacity:1;text-decoration:underline;text-underline-offset:4px}
.pi-b{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-top:clamp(50px,6vw,90px);padding-top:22px;border-top:1px solid color-mix(in srgb,var(--invtx) 22%,transparent)}
.pi-b .k{color:color-mix(in srgb,var(--invtx) 50%,transparent)}

/* ── Paneles (avisos, canales, soporte, buscar) ── */
.ov[hidden]{display:none!important}
.ov{position:fixed;inset:0;z-index:90;background:color-mix(in srgb,#000 55%,transparent);display:flex;justify-content:flex-end}
.pn{width:min(520px,100%);height:100%;overflow-y:auto;background:var(--bg);padding:34px clamp(22px,3vw,40px);animation:ent .26s cubic-bezier(.3,.8,.3,1)}
@keyframes ent{from{transform:translateX(24px);opacity:.5}to{transform:none;opacity:1}}
.pn-h{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:30px}
.pn-h h2{margin:12px 0 0;font-weight:400;font-size:34px;line-height:1.05;letter-spacing:-.03em}
.pn-h p{margin:12px 0 0;color:var(--tx2)}
.x{width:44px;height:44px;border:1px solid var(--ln2);display:grid;place-items:center;flex:none}
.x:hover{background:var(--tx);color:var(--bg)}
.cp{display:block;margin-bottom:22px}
.cp span{display:block;margin-bottom:8px}
.cp input{width:100%;height:50px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:inherit;font-size:17px;padding:0 14px;outline:none}
.cp input:focus{border-color:var(--ln2)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:52px;border:1px solid var(--ln2);font-size:17px;transition:.15s}
.btn.pr,.btn:hover{background:var(--tx);color:var(--bg)}
.btn.pr:hover{background:transparent;color:var(--tx)}
.kv{display:grid;grid-template-columns:110px 1fr;gap:16px;padding:16px 0;border-bottom:1px solid var(--ln)}
.kv span:last-child{font:14px var(--mo);color:var(--tx2);word-break:break-all}
.bs-r{display:block;padding:16px 0;border-bottom:1px solid var(--ln)}
.bs-r b{display:block;font-weight:400;font-size:19px;margin-top:6px;letter-spacing:-.01em}
.bs-r:hover b{text-decoration:underline;text-underline-offset:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>

<header class="hd"><div class="w">
  <div class="hd-a">
    <a class="mk" href="#" aria-label="Ofhir · Newsroom"><img src="logo-ofhir.png" alt="Ofhir" width="72" height="24"><span>Newsroom</span></a>
    <span class="sp"></span>
    <a class="hd-st" href="#status" id="hdSt"><span class="dot"></span><b>Status</b></a>
    <div class="sq">
      <button type="button" data-buscar aria-label="Buscar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg></button>
      <button type="button" data-tema aria-label="Cambiar tema"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16Z" fill="currentColor"/></svg></button>
    </div>
  </div>
  <nav class="nv" id="nv" aria-label="Secciones"></nav>
</div></header>

<main id="app"><div class="w"><div class="vc">Cargando…</div></div></main>
<div id="pie"></div>
<div class="ov" id="ov" hidden></div>

<script>
/* ════════ DATOS ════════
   entradas.json: las publicaciones (se editan desde Core → Status). Campo "t":
     novedad → Noticias · aviso → Anuncios · avance → Avances · pensamiento → Pensamientos
     prensa → Prensa · estado → Status (incidentes y mantenimientos)
   estado-global.json / historial.json: estado real de la plataforma (UptimeRobot, cada 5 min).
   componentes.json y divisiones.json: catálogos. Enlaces viejos #e-<id> siguen funcionando. */
const SEC=[
  {k:'noticias',c:'#8E6BC9',t:'novedad',n:'Noticias',w:'NOTICIAS',bg:'#D9C8F0',d:'Lo nuevo en nuestras plataformas: funciones, mejoras y lanzamientos.'},
  {k:'anuncios',c:'#9A8455',t:'aviso',n:'Anuncios',w:'ANUNCIOS',bg:'#E7E1D3',d:'Comunicados oficiales de Ofhir: cambios, decisiones y lo que viene.'},
  {k:'avances',c:'#3E8E66',t:'avance',n:'Avances',w:'AVANCES',bg:'#CDE4D7',d:'Notas de progreso de lo que estamos construyendo, en el orden en que pasa.'},
  {k:'pensamientos',c:'#6E737A',t:'pensamiento',n:'Pensamientos',w:'IDEAS',bg:'#DADDE1',d:'Ideas, principios y puntos de vista sobre datos, software y operación.'},
  {k:'prensa',c:'#4F79B8',t:'prensa',n:'Prensa',w:'PRENSA',bg:'#CCDAEE',d:'Cobertura en medios, entrevistas y menciones de Ofhir.'},
  {k:'status',c:'',t:'estado',n:'Status',w:'STATUS',bg:'#0B0C0E',d:'Estado de la plataforma en tiempo real, incidentes y mantenimientos.'}
];

function hace(f){const m=Math.round((HOY-f)/60000);if(m<1)return'justo ahora';if(m<60)return`hace ${m} min`;if(m<1440)return`hace ${Math.round(m/60)} h`;

/* Formato del cuerpo (mismo que el editor de Core): # títulos, - viñetas, 1. números, [ ] tareas,
   > citas, !! destacado, --- separador, **negrita** *cursiva* ~~tachado~~ ==resaltado== `código` [texto](url). */
function enLinea(s){
  const g=[],tok=h=>'\u0000'+(g.push(h)-1)+'\u0000';
  const a=(u,x)=>tok(`<a href="${u}" target="_blank" rel="noopener noreferrer">${x}</a>`);
  let t=esc(s).replace(/`([^`]+)`/g,(_,c)=>tok(`<code>${c}</code>`))
    .replace(/\[([^\]]+)\]\(((?:https?:\/\/|mailto:)[^\s)]+)\)/g,(_,x,u)=>a(u,x))
    .replace(/(^|[\s(])(https?:\/\/[^\s<]*[^\s<.,;:!?)])/g,(_,p,u)=>p+a(u,u.replace(/^https?:\/\//,'')));
  t=t.replace(/\*\*(?=\S)(.+?)\*\*/g,'<strong>$1</strong>').replace(/~~(?=\S)(.+?)~~/g,'<s>$1</s>').replace(/==(?=\S)(.+?)==/g,'<mark>$1</mark>')
    .replace(/(^|[^*\w])\*(?=\S)([^*]+?)\*(?!\w)/g,'$1<em>$2</em>').replace(/(^|[^_\w])_(?=\S)([^_]+?)_(?!\w)/g,'$1<em>$2</em>');
  return t.replace(/\u0000(\d+)\u0000/g,(_,i)=>g[+i]);
}
const plano=s=>String(s||'').replace(/\*\*|~~|==|`/g,'').replace(/\[([^\]]+)\]\([^)]+\)/g,'$1');
function cuerpo(t){
  let o='',par=[],lis=null,cita=[];
  const fPar=()=>{if(par.length){o+=`<p>${par.map(enLinea).join('<br>')}</p>`;par=[];}};
  const fCita=()=>{if(cita.length){o+=`<blockquote>${cita.map(enLinea).join('<br>')}</blockquote>`;cita=[];}};
  const lista=l=>`<${l.tag==='ol'?'ol':'ul'}${l.tag==='tl'?' class="md-tl"':''}${l.tag==='ol'&&l.ini!==1?` start="${l.ini}"`:''}>${l.it.map(i=>`<li${i.ok!=null?` class="${i.ok?'md-ok':'md-no'}"`:''}>${enLinea(i.x)}${i.sub?lista(i.sub):''}</li>`).join('')}</${l.tag==='ol'?'ol':'ul'}>`;
  const fLis=()=>{if(lis){o+=lista(lis);lis=null;}};
  const todo=()=>{fPar();fCita();fLis();};
  // Negritas que quedaron partidas por un salto de línea ("**Título\n**") se juntan
  (t||'').replace(/\r\n?/g,'\n').replace(/\*\*([^\n*]+?)\s*\n\s*\*\*/g,'**$1**\n').split('\n').forEach(raw=>{
    const s=raw.trim(),ind=(raw.match(/^[ \t]*/)[0]).replace(/\t/g,'  ').length;let m;
    if(!s){todo();return;}
    if(/^(-{3,}|\*{3,}|_{3,})$/.test(s)){todo();o+='<hr>';return;}
    if((m=/^(#{1,3})\s+(.+)$/.exec(s))){todo();o+=`<h${m[1].length+2} class="md-h">${enLinea(m[2])}</h${m[1].length+2}>`;return;}
    if((m=/^!!\s*(.+)$/.exec(s))){todo();o+=`<div class="md-dest">${enLinea(m[1])}</div>`;return;}
    if((m=/^>\s?(.*)$/.exec(s))||s.startsWith('"')){fPar();fLis();cita.push(m?m[1]:s);return;}
    let it=null;
    if((m=/^(?:[-*•]\s+)?\[( |x|X)\]\s+(.+)$/.exec(s)))it={tag:'tl',x:m[2],ok:m[1]!==' '};
    else if((m=/^[-*•]\s+(.+)$/.exec(s))||(m=/^·\s*(.+)$/.exec(s)))it={tag:'ul',x:m[1]};
    else if((m=/^(\d{1,3})[.)]\s+(.+)$/.exec(s)))it={tag:'ol',x:m[2],n:+m[1]};
    if(it){fPar();fCita();const item={x:it.x,ok:it.ok==null?null:it.ok,sub:null};
      if(ind>=2&&lis&&lis.it.length){const p=lis.it[lis.it.length-1];if(!p.sub)p.sub={tag:it.tag,ini:it.n||1,it:[]};p.sub.it.push(item);return;}
      if(lis&&lis.tag!==it.tag)fLis();if(!lis)lis={tag:it.tag,ini:it.n||1,it:[]};lis.it.push(item);return;}
    if(ind>=2&&lis&&lis.it.length){const p=lis.it[lis.it.length-1];(p.sub&&p.sub.it.length?p.sub.it[p.sub.it.length-1]:p).x+='\n'+s;return;}
    fCita();fLis();par.push(s);
  });
  todo();return o.replace(/\n/g,'<br>');
}

/* ════════ PORTADAS GENERADAS ════════
   Cuadrícula de 8×4 con líneas finas, las letras de la sección repartidas en orden y
   círculos (el ojo de Ofhir) en celdas vacías. Determinista: la misma publicación siempre
   genera la misma portada. Si la entrada trae "img" (https), se usa esa imagen. */
function hash(s){let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;}
function rnd(seed){let x=seed||1;return()=>{x^=x<<13;x^=x>>>17;x^=x<<5;return((x>>>0)%10000)/10000;};}
function portada(sec,semilla,titulo){

  const ln=osc?'rgba(255,255,255,.34)':'rgba(17,18,20,.5)',tx=osc?'#F4F4F2':'#111214';
  const letras=[...sec.w],usadas=new Set(['1,0','2,0','0,3','2,3','6,3']),celdas=[];
  // letras en orden de izquierda a derecha, en filas al azar
  const paso=C/letras.length;
  letras.forEach((l,i)=>{let col=Math.min(C-1,Math.floor(i*paso+r()*paso*.6)),fila=Math.floor(r()*F);
    while(usadas.has(col+','+fila))fila=(fila+1)%F;usadas.add(col+','+fila);celdas.push({col,fila,l});});
  // bloques de cuadrícula: unas celdas sueltas, otras agrupadas (como el cartel)
  let g='';
  for(let c=0;c<C;c++)for(let f=0;f<F;f++){if(r()<.78)g+=`<rect x="${c*cw}" y="${f*ch}" width="${cw}" height="${ch}" fill="none" stroke="${ln}" stroke-width="1"/>`;}
  let circ='',n=0;
  for(let i=0;i<40&&n<4;i++){const c=Math.floor(r()*C),f=Math.floor(r()*F);if(usadas.has(c+','+f)||(f===0&&c<3))continue;usadas.add(c+','+f);n++;
    circ+=`<circle cx="${c*cw+cw/2}" cy="${f*ch+ch/2}" r="${Math.min(cw,ch)/2}" fill="none" stroke="${ln}" stroke-width="1"/>`;}
  const let_=celdas.map(o=>`<text x="${o.col*cw+cw/2}" y="${o.fila*ch+ch/2+20}" text-anchor="middle" font-family="Inter Tight,system-ui,sans-serif" font-size="58" font-weight="400" fill="${tx}">${esc(o.l)}</text>`).join('');
  const t=String(titulo||'').slice(0,64),pal=t.split(' '),lin=[];let a='';pal.forEach(w=>{if((a+' '+w).trim().length>24&&a){lin.push(a);a=w;}else a=(a+' '+w).trim();});if(a)lin.push(a);
  const tit=lin.slice(0,3).map((l,i)=>`<text x="${cw*1+14}" y="${30+i*17}" font-family="Inter Tight,system-ui,sans-serif" font-size="14" fill="${tx}">${esc(l)}</text>`).join('');
  const ojo=`<g transform="translate(18,${H-34}) scale(.07)" fill="none" stroke="${tx}" stroke-width="20" stroke-linecap="round"><circle cx="140" cy="142" r="84"/><path d="M25 139 80 84M255 139 200 84"/></g>`;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" role="img" aria-label="${esc(sec.n)}"><rect width="${W}" height="${H}" fill="${sec.bg}"/>${g}${circ}${let_}
    <text x="${cw+14}" y="14" font-size="11" fill="${tx}" font-family="JetBrains Mono,monospace">↘</text>${tit}${ojo}
    <text x="${cw*2+12}" y="${H-14}" font-family="JetBrains Mono,monospace" font-size="9.5" letter-spacing="1" fill="${tx}">OFHIR — ${esc(sec.n.toUpperCase())}</text>
    <text x="${cw*6+12}" y="${H-14}" font-family="JetBrains Mono,monospace" font-size="9.5" fill="${tx}">${HOY.getFullYear()}</text></svg>`;
}

        <div class="st-n"><div><b>${pct(u.dia)}</b><span class="k">Hoy</span></div><div><b>${pct(u.semana)}</b><span class="k">7 días</span></div><div><b>${pct(u.mes)}</b><span class="k">30 días</span></div><div><b>${pct(u.dias90)}</b><span class="k">90 días</span></div></div>
        ${HIST.length?`<div class="st-b"><div class="bars">${barras()}</div><div class="bars-l"><span class="k">Hace 90 días</span><span class="k">Hoy</span></div></div>`:''}
        ${r&&r.length>1?`<div style="margin-top:40px"><div style="display:flex;justify-content:space-between;align-items:baseline"><span class="k">Tiempo de respuesta · últimos ${r.length} chequeos</span><b class="mo" style="font-weight:400;font-size:18px">${r[r.length-1].ms} ms</b></div>
          <div class="spark" style="margin-top:12px">${sparkline(r)}</div><div class="bars-l" style="margin-top:6px"><span class="k">${Math.min(...r.map(x=>x.ms))} ms</span><span class="k">${Math.max(...r.map(x=>x.ms))} ms</span></div></div>`:''}
      </div>
      <div><span class="k" style="display:block;margin-bottom:14px">Componentes</span>
        <div class="cm">${COMP.map(c=>{const a=afect.has(c.k);return `<div>${esc(c.n)}<span class="${a?'rie':'ok'}"><span class="dot ${a?'rie':'ok'}"></span>${a?'Con incidencia':'Operativo'}</span></div>`;}).join('')}</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:30px"><button type="button" class="btn pr" data-sus>Recibir avisos</button><button type="button" class="btn" data-rss>Canales</button></div>
        <p class="k" style="margin-top:18px">Monitoreo de app.pahlass.com cada ${GLOBAL&&GLOBAL.intervaloMin||5} min · vía UptimeRobot</p></div>
    </div></section>
    <section class="sec"><div class="sec-h"><h2>Incidentes y mantenimientos</h2></div>
      ${inc.length?`<div class="ls">${inc.map(fila).join('')}</div>`:'<div class="vc">Sin incidentes registrados.</div>'}</section></div>`;
}
function pie(){
  return `<footer class="pi"><div class="w"><div class="pi-g">
    <div><img src="logo-ofhir.png" alt="Ofhir" width="190" height="63"><p>Ingeniería de datos y software para que cada operación tenga el control total de su información.</p></div>
    <div><h4>Newsroom</h4><ul>${SEC.map(s=>`<li><a href="#${s.k}">${esc(s.n)}</a></li>`).join('')}</ul></div>
    <div><h4>Divisiones</h4><ul>${DIVS.map(d=>`<li><a href="#" data-div-ir="${esc(d.k)}">${esc(d.n)}</a></li>`).join('')}</ul></div>
    <div><h4>Contacto</h4><ul><li><button type="button" data-sus>Recibir avisos</button></li><li><button type="button" data-rss>Canales RSS</button></li><li><button type="button" data-sop>Soporte</button></li><li><a href="mailto:hola@pahlass.com">hola@pahlass.com</a></li></ul></div>
  </div><div class="pi-b"><span class="k">© ${HOY.getFullYear()} Ofhir</span><span class="k">status.pahlass.com</span></div></div></footer>`;
}

/* ════════ RUTAS ════════
   #            → portada            #noticias, #anuncios… → sección
   #status      → estado completo    #e-<id> (o #<id>)     → publicación */
function ruta(){
  const h=decodeURIComponent((location.hash||'').slice(1));
  let html,actual='';
  if(!h)html=vInicio();
  else if(SECK[h]){html=vSeccion(SECK[h]);actual=h;}
  else{const id=h.replace(/^e-/,''),e=E.find(x=>x.id===id);
    if(e){html=vArticulo(e);actual=secDe(e).k;}else html=vInicio();}
  $('nv').innerHTML=SEC.map(s=>`<a href="#${s.k}"${s.k===actual?' aria-current="page"':''}>${esc(s.n)}</a>`).join('');
  $('app').innerHTML=html;
  const conBanda=!h;$('pie').innerHTML=pie();$('pie').firstElementChild.style.marginTop=conBanda?'0':'';
  const g=gl();$('hdSt').innerHTML=`<span class="dot ${g.c} vivo"></span><b>Status</b>`;$('hdSt').title=g.t;
  document.title=(h&&SECK[h]?SECK[h].n+' — ':h&&E.find(x=>x.id===h.replace(/^e-/,''))?E.find(x=>x.id===h.replace(/^e-/,'')).ti+' — ':'Newsroom — ')+'Ofhir';
  if(ultimaRuta!==h)window.scrollTo(0,0);ultimaRuta=h;
}

/* ════════ PANELES ════════ */
const abre=h=>{const o=$('ov');o.hidden=false;o.innerHTML=`<div class="pn" role="dialog" aria-modal="true">${h}</div>`;document.body.style.overflow='hidden';};
const cierra=()=>{$('ov').hidden=true;document.body.style.overflow='';};
const cab=(k,t,p)=>`<div class="pn-h"><div><span class="k">${k}</span><h2>${t}</h2>${p?`<p>${p}</p>`:''}</div><button type="button" class="x" data-cerrar aria-label="Cerrar">${X}</button></div>`;
function buscar(q){q=q.trim().toLowerCase();const l=q?E.filter(e=>[e.ti,e.rs,e.x,e.autor].join(' ').toLowerCase().includes(q)).slice(0,20):E.slice(0,8);
  $('bsR').innerHTML=l.length?l.map(e=>`<a class="bs-r" href="#e-${encodeURIComponent(e.id)}" data-cerrar>${chipSec(secDe(e))} <span class="k mo">· ${fd(e.f)}</span><b>${esc(e.ti)}</b></a>`).join(''):'<div class="vc">Sin resultados.</div>';}

document.addEventListener('click',ev=>{
  const t=ev.target;
  if(t.id==='ov'||t.closest('[data-cerrar]')){if(!t.closest('a'))ev.preventDefault();cierra();return;}
  if(t.closest('[data-tema]')){const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem('sp.tema',n);}catch(_){}return;}
  if(t.closest('[data-buscar]')){abre(cab('Buscar','Buscar en el Newsroom')+`<label class="cp"><span class="k">Palabra o frase</span><input id="bsQ" type="search" autocomplete="off"></label><div id="bsR"></div>`);
    buscar('');const q=$('bsQ');q.focus();q.addEventListener('input',()=>buscar(q.value));return;}
  const dv=t.closest('[data-div]');if(dv){div=dv.dataset.div;ruta();return;}
  const di=t.closest('[data-div-ir]');if(di){ev.preventDefault();div=di.dataset.divIr;if(location.hash){location.hash='';}else ruta();return;}
  const cp=t.closest('[data-copiar]');if(cp){const u=location.origin+location.pathname+'#e-'+encodeURIComponent(cp.dataset.copiar);
    (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>{cp.textContent='Enlace copiado ✓';},()=>{prompt('Copia el enlace:',u);});return;}
  if(t.closest('#sok')){const c=($('sc')||{}).value||'',w=($('st')||{}).value||'';
    location.href=`mailto:hola@pahlass.com?subject=${encodeURIComponent('Alta en avisos — Ofhir')}&body=${encodeURIComponent(`Quiero recibir avisos de Ofhir.\n\nCorreo: ${c}\nWhatsApp: ${w||'(no proporcionado)'}`)}`;
    $('sf').innerHTML=`<p style="color:var(--tx2);font-size:17px">Se abrió tu correo con la solicitud lista${c?` a nombre de <b style="color:var(--tx);font-weight:500">${esc(c)}</b>`:''}. Envíala y quedas dado de alta.</p><button type="button" class="btn" data-cerrar style="margin-top:22px">Cerrar</button>`;return;}
  if(t.closest('[data-sus]'))return abre(cab('Avisos','Te escribimos cuando algo pasa.','Incidentes, mantenimientos y anuncios importantes. Nada comercial.')+
    `<div id="sf"><label class="cp"><span class="k">Correo</span><input id="sc" type="email" autocomplete="email"></label><label class="cp"><span class="k">WhatsApp (opcional)</span><input id="st" type="tel" autocomplete="tel"></label><button type="button" class="btn pr" id="sok">Suscribirme</button></div>`);
  if(t.closest('[data-rss]'))return abre(cab('Canales','Para seguirnos desde otra herramienta.')+
    `<div class="kv"><span class="k">Newsroom</span><span>status.pahlass.com/bitacora.xml</span></div><div class="kv"><span class="k">Incidentes</span><span>status.pahlass.com/incidentes.xml</span></div><div class="kv"><span class="k">Estado</span><span>status.pahlass.com/api/estado.json</span></div>`);
  if(t.closest('[data-sop]'))return abre(cab('Soporte','Reportar un problema.','Si apareció dentro de la plataforma, en la pantalla de Registro hay un botón para copiar el reporte del error: trae todo lo necesario.')+
    `<div class="kv"><span class="k">Correo</span><span>hola@pahlass.com</span></div><div class="kv"><span class="k">WhatsApp</span><span>+52 667 712 4400</span></div>`);
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&!$('ov').hidden)cierra();if(ev.key==='/'&&$('ov').hidden&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){ev.preventDefault();document.querySelector('[data-buscar]').click();}});

/* ════════ CARGA ════════ */
async function cargar(){
  const j=u=>fetch(u,{cache:'no-store'}).then(r=>r.json());
  const [comp,ent,g,h,d]=await Promise.all([j('data/componentes.json').catch(()=>[]),j('data/entradas.json'),j('data/estado-global.json').catch(()=>null),j('data/historial.json').catch(()=>[]),j('data/divisiones.json').catch(()=>[])]);
  COMP=comp;GLOBAL=g;HIST=h;DIVS=d;
  // Las fechas "AAAA-MM-DD" se leen en hora local; "ts" es el momento real de publicación
  E=ent.map((e,i)=>({...e,_i:i,f:new Date(e.f+'T00:00:00'),ts:e.ts?new Date(e.ts):null,fin:e.fin?new Date(e.fin):null,comp:e.comp||[],upd:(e.upd||[]).map(u=>({...u,h:new Date(u.h)}))}))
    .sort((a,b)=>(b.ts||b.f)-(a.ts||a.f)||b._i-a._i);
}
(function(){
  let t='light';try{t=localStorage.getItem('sp.tema')||'light';}catch(_){}
  document.documentElement.dataset.theme=t;
  cargar().then(()=>{ruta();window.addEventListener('hashchange',ruta);
    setInterval(()=>{const a=$('ultimoCheck');if(a)a.textContent=haceVivo(GLOBAL&&GLOBAL.actualizado);const b=$('opDesde');if(b&&GLOBAL)b.textContent=duracionDesde(GLOBAL.operativoDesde);},1000);
    setInterval(()=>{fetch('data/estado-global.json',{cache:'no-store'}).then(r=>r.json()).then(g=>{GLOBAL=g;const h=location.hash;if(!h||h==='#status'){const y=scrollY;ruta();scrollTo(0,y);}}).catch(()=>{});},60000);
  }).catch(()=>{$('app').innerHTML='<div class="w"><div class="vc">No se pudo cargar el Newsroom. Intenta recargar la página.</div></div>';});
})();
</script>
