name: Actualizar estado de Newton

# Corre cada 5 minutos (mismo intervalo que el chequeo de UptimeRobot,
# ver scripts/actualizar-estado.mjs) y sube data/estado-global.json si
# cambió. workflow_dispatch permite dispararlo a mano para probar.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: actualizar-estado
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Consultar UptimeRobot y regenerar data/estado-global.json
        env:
          UPTIMEROBOT_API_KEY: ${{ secrets.UPTIMEROBOT_API_KEY }}
        run: node scripts/actualizar-estado.mjs

      - name: Regenerar feeds derivados
        run: node scripts/generar-feeds.mjs

      - name: Subir cambios si los hay
        run: |
          git config user.name "pahlass-status-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/estado-global.json api/estado.json bitacora.xml incidentes.xml
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Actualizar estado de Newton [automático]"
            git push
          fi
